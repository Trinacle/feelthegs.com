name: Deploy theme to server

# Push to main -> theme files are synced to feelthegs.com via SFTP.
# Also runnable on demand from the Actions tab (workflow_dispatch).
#
# Server: feelthegs.com on PrivateSystems (cp54-ga.privatesystems.net), cPanel
# user `feelthg`, behind Cloudflare + LiteSpeed Cache.
#
# IMPORTANT: bash/shell access is DISABLED on this cPanel account (only SFTP
# works). So we can't use rsync, ssh, or WP-CLI. This pipeline uploads files
# via SFTP (lftp mirror) instead. The LiteSpeed cache is purged via an HTTP
# request once files are uploaded.
#
# Required GitHub secrets: SSH_HOST, SSH_USER, SSH_PORT, SSH_KEY (private ed25519),
# DEPLOY_PATH (absolute server path to the theme dir, e.g.
# /home/feelthg/public_html/wp-content/themes/feelthegs).
# Required GitHub variable: DEPLOY_ENABLED=true (set once secrets are added).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-feelthegs
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/key
            IdentitiesOnly yes
            PreferredAuthentications publickey
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Install lftp (SFTP mirror client)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Mirror theme to server via SFTP
        # lftp mirror uploads only changed files (rsync-like over SFTP).
        # --no-perms avoids chmod errors (the cPanel account can't chmod some files).
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -i ~/.ssh/key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes';
            open sftp://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }};
            mirror --reverse --verbose --no-perms --no-symlinks \
              --exclude-glob '.git/' \
              --exclude-glob '.github/' \
              --exclude-glob 'README.md' \
              --exclude-glob '.gitignore' \
              --exclude-glob '.cpanel.yml' \
              --exclude-glob '.htaccess' \
              ./ ${{ secrets.DEPLOY_PATH }}/;
            quit;
          "

      - name: Purge LiteSpeed cache
        if: always()
        run: |
          curl -s -A "Mozilla/5.0" "https://feelthegs.com/?litespeed_purgeall=1" -o /dev/null || true
          echo "LiteSpeed purge triggered."
